name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Run JVM regression tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JVM-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Feldaufmass-Pro-v0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_2
          arch: x86_64
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Check Android 16 with three-button navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          profile: pixel_2
          arch: x86_64
          script: |
            adb shell cmd overlay enable-exclusive --user current --category com.android.internal.systemui.navbar.threebutton
            gradle :app:connectedDebugAndroidTest --rerun-tasks --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class de.feldaufmass.pro.UiScreenshotTest de.feldaufmass.pro.test/androidx.test.runner.AndroidJUnitRunner > screenshot-test.log
            cat screenshot-test.log
            grep -F 'OK (6 tests)' screenshot-test.log
            mkdir -p ui-screenshots
            adb shell run-as de.feldaufmass.pro ls files/ui-screenshots
            for name in 01-start-menu 02-normal-portrait 03-normal-landscape 04-full-portrait 05-full-landscape 06-regelprofil; do adb exec-out run-as de.feldaufmass.pro cat files/ui-screenshots/$name.png > ui-screenshots/$name.png && test -s ui-screenshots/$name.png || exit 1; done
      - name: Upload real UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Android-16-UI-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: error
      - name: Report Android test failures
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for failure in case.findall("failure") + case.findall("error"):
                      print(case.get("name"), failure.text)
