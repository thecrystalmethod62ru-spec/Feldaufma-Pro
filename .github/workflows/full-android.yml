name: Full Android Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
concurrency:
  group: full-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether code changed
        id: check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -n "$(git log -1 --since='24 hours ago' --format=%H -- app build.gradle settings.gradle gradle.properties .github/workflows)" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
  android-tests:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Run JVM regression tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build app and instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 36 && 'google_apis' || 'default' }}
          profile: pixel_2
          arch: x86_64
          script: |
            if [ "${{ matrix.api }}" = "36" ]; then adb shell cmd overlay enable-exclusive --user current --category com.android.internal.systemui.navbar.threebutton; fi
            test_status=0
            gradle :app:connectedDebugAndroidTest --stacktrace || test_status=$?
            if [ "${{ matrix.api }}" = "36" ]; then
              adb install -r app/build/outputs/apk/debug/app-debug.apk || test_status=1
              adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || test_status=1
              adb shell am instrument -w -r -e class de.feldaufmass.pro.UiScreenshotTest de.feldaufmass.pro.test/androidx.test.runner.AndroidJUnitRunner > screenshot-test.log || test_status=1
              cat screenshot-test.log
              grep -F 'OK (6 tests)' screenshot-test.log || test_status=1
              mkdir -p ui-screenshots
              for name in 01-start-menu 02-normal-portrait 03-normal-landscape 04-full-portrait 05-full-landscape 06-regelprofil; do
                if ! adb exec-out run-as de.feldaufmass.pro cat files/ui-screenshots/$name.png > ui-screenshots/$name.png || ! test -s ui-screenshots/$name.png; then
                  rm -f ui-screenshots/$name.png
                  test_status=1
                fi
              done
            fi
            exit "$test_status"
      - name: Upload real UI screenshots
        if: ${{ always() && matrix.api == 36 }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-16-UI-screenshots
          path: |
            ui-screenshots/*.png
            screenshot-test.log
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-${{ matrix.api }}-test-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
