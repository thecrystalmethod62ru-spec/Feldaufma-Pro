name: Fast Screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build screenshot APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture UI on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          profile: pixel_2
          arch: x86_64
          script: |
            set -e
            adb shell cmd overlay enable-exclusive --user current --category com.android.internal.systemui.navbar.threebutton
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            test_status=0
            adb shell am instrument -w -r -e class de.feldaufmass.pro.UiScreenshotTest de.feldaufmass.pro.test/androidx.test.runner.AndroidJUnitRunner > screenshot-test.log || test_status=1
            cat screenshot-test.log
            grep -F 'OK (6 tests)' screenshot-test.log || test_status=1
            mkdir -p ui-screenshots
            for name in 01-start-menu 02-normal-portrait 03-normal-landscape 04-full-portrait 05-full-landscape 06-regelprofil; do
              if ! adb exec-out run-as de.feldaufmass.pro cat files/ui-screenshots/$name.png > ui-screenshots/$name.png || ! test -s ui-screenshots/$name.png; then
                rm -f ui-screenshots/$name.png
                test_status=1
              fi
            done
            exit "$test_status"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-16-UI-screenshots
          path: |
            ui-screenshots/*.png
            screenshot-test.log
          if-no-files-found: warn
