name: UI Preview
on:
  push:
    branches: [ui-preview]
    paths:
      - '.github/workflows/ui-preview.yml'
      - 'app/src/androidTest/java/de/feldaufmass/pro/UiScreenshotTest.java'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Android APK build run ID
        required: true
        default: '46077091536'
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN: ${{ inputs.source_run_id || '46077091536' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve APK source revision
        id: source
        run: |
          echo "sha=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN --jq .head_sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Get screenshot harness from preview revision
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/app/src/androidTest/java/de/feldaufmass/pro/UiScreenshotTest.java?ref=${GITHUB_SHA}" -H 'Accept: application/vnd.github.raw+json' > app/src/androidTest/java/de/feldaufmass/pro/UiScreenshotTest.java
      - uses: actions/download-artifact@v4
        with:
          name: Feldaufmass-Pro-v0.1
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: preview-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compile screenshot harness only
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture four actual app screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_2
          arch: x86_64
          script: |
            adb install -r preview-apk/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p ui-screenshots
            for method in fullPortrait fullLandscape regelprofil regelprofilLandscape; do
              adb shell am instrument -w -r -e class "de.feldaufmass.pro.UiScreenshotTest#$method" de.feldaufmass.pro.test/androidx.test.runner.AndroidJUnitRunner > "ui-screenshots/$method.log" || true
            done
            for name in 04-full-portrait 05-full-landscape 06-regelprofil 07-regelprofil-landscape; do
              adb exec-out run-as de.feldaufmass.pro cat "files/ui-screenshots/$name.png" > "ui-screenshots/$name.png" || true
              if ! test -s "ui-screenshots/$name.png"; then rm -f "ui-screenshots/$name.png"; fi
            done
            test "$(find ui-screenshots -name '*.png' | wc -l)" -eq 4
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-Preview
          path: ui-screenshots/
          if-no-files-found: warn
