name: UI Preview
on:
  push:
    branches: [ui-preview]
    paths:
      - '.github/workflows/ui-preview.yml'
      - 'app/src/androidTest/java/de/feldaufmass/pro/UiScreenshotTest.java'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Android APK build run ID
        required: true
        default: '46117908443'
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN: ${{ inputs.source_run_id || '46117908443' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve APK source revision
        id: source
        run: |
          echo "sha=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN --jq .head_sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Get screenshot harness from preview revision
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/app/src/androidTest/java/de/feldaufmass/pro/UiScreenshotTest.java?ref=${GITHUB_SHA}" -H 'Accept: application/vnd.github.raw+json' > app/src/androidTest/java/de/feldaufmass/pro/UiScreenshotTest.java
      - uses: actions/download-artifact@v4
        with:
          name: Feldaufmass-Pro-v0.1
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: preview-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore compiled screenshot harness
        id: harness
        uses: actions/cache@v4
        with:
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          key: ui-harness-v1-${{ runner.os }}-${{ steps.source.outputs.sha }}-${{ hashFiles('app/src/androidTest/java/de/feldaufmass/pro/UiScreenshotTest.java') }}
      - name: Compile screenshot harness only
        if: steps.harness.outputs.cache-hit != 'true'
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Match APK signatures for screenshot instrumentation
        run: |
          set -euo pipefail
          KEY="$HOME/.android/debug.keystore"
          if ! test -f "$KEY"; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$KEY" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          SIGN="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in preview-apk/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            "$SIGN" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            "$SIGN" verify "$apk"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore clean Android emulator snapshot
        id: avd
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/test.avd
            ~/.android/avd/test.ini
          key: ui-avd-v1-${{ runner.os }}-api34-default-x86_64-pixel2
      - name: Prepare clean emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_2
          arch: x86_64
          avd-name: test
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Clean emulator snapshot prepared"
      - name: Capture four actual app screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          profile: pixel_2
          arch: x86_64
          avd-name: test
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install -r preview-apk/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant de.feldaufmass.pro android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant de.feldaufmass.pro android.permission.ACCESS_FINE_LOCATION || true
            adb shell cmd statusbar collapse || true
            mkdir -p ui-screenshots
            for method in fullPortrait fullLandscape regelprofil regelprofilLandscape; do adb shell am instrument -w -r -e class "de.feldaufmass.pro.UiScreenshotTest#$method" de.feldaufmass.pro.test/androidx.test.runner.AndroidJUnitRunner > "ui-screenshots/$method.log" || true; done
            for name in 04-full-portrait 05-full-landscape 06-regelprofil 07-regelprofil-landscape; do adb exec-out run-as de.feldaufmass.pro cat "files/ui-screenshots/$name.png" > "ui-screenshots/$name.png" || true; if ! test -s "ui-screenshots/$name.png"; then rm -f "ui-screenshots/$name.png"; fi; done
            python3 -c 'from pathlib import Path; files=list(Path("ui-screenshots").glob("*.png")); bad=[p for p in files if p.read_bytes()[:8]!=bytes.fromhex("89504e470d0a1a0a") or len(p.read_bytes())<1024]; [p.unlink() for p in bad]; assert len(files)==4 and not bad, "Missing or invalid PNG screenshots"'
            for log in ui-screenshots/*.log; do grep -F "OK (1 test)" "$log" || exit 1; done
      - name: Compare with approved portrait mockups
        if: always()
        run: |
          mkdir -p preview-reference
          for name in drawing profile; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/design/reference/${name}.png?ref=${GITHUB_SHA}" -H 'Accept: application/vnd.github.raw+json' > "preview-reference/$name.png" || rm -f "preview-reference/$name.png"
          done
          gh api "repos/${GITHUB_REPOSITORY}/contents/tools/compare_preview.py?ref=${GITHUB_SHA}" -H 'Accept: application/vnd.github.raw+json' > compare_preview.py
          python3 -m pip install Pillow
          python3 compare_preview.py
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-Preview
          path: ui-screenshots/
          if-no-files-found: warn
