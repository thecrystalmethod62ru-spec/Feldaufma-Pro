plugins { id 'com.android.application' }
android { namespace 'de.feldaufmass.pro'; compileSdk 35
 defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 applicationId 'de.feldaufmass.pro'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1' }
}

dependencies { implementation "com.google.mlkit:translate:17.0.3"
 implementation 'androidx.core:core:1.13.1'
 implementation 'com.google.mlkit:text-recognition:16.0.1' }

dependencies {
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Align Kotlin runtime modules to avoid duplicate classes from transitive dependencies.
dependencies {
 implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
 androidTestImplementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

dependencies { testImplementation 'junit:junit:4.13.2' }
